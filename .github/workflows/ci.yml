name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pinned pnpm version from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm run typecheck

      # The test:unit/test:integration scripts use path filters that mis-select
      # the vitest projects; select projects explicitly instead.
      - name: Unit tests
        run: npx vitest run --project unit

      - name: Integration tests
        run: npx vitest run --project integration

  integration-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alphorn
          POSTGRES_PASSWORD: alphorn
          # tests/integration/db/setup.ts refuses DBs not named test/integration.
          POSTGRES_DB: alphorn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alphorn:alphorn@localhost:5432/alphorn_test
      BETTER_AUTH_SECRET: ci-integration-test-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Check schema/migration drift
        run: ./scripts/check-migration-drift.sh

      - name: DB integration tests
        run: npx vitest run --project integration-db
